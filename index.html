<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Plantonistas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f8;color:#202124}
.hide{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box,.panel{background:#fff;border:1px solid #e6e9ec;border-radius:14px;box-shadow:0 3px 15px #0000000d}
.box{width:420px;max-width:100%;padding:30px}.box h1{margin:0 0 6px}.muted{color:#6b7280;font-size:13px}
label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd2d8;border-radius:8px;font-size:14px}
.field{margin:14px 0}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.green{background:#197659;color:#fff}.white{background:#fff;color:#197659;border:1px solid #197659}.red{background:#c62828;color:#fff}.gray{background:#e9ecef}.blue{background:#2563eb;color:#fff}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 3%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:20px;margin:0}main{width:94%;max-width:1450px;margin:22px auto 50px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.card{background:#fff;border:1px solid #e7eaed;border-radius:12px;padding:17px;cursor:pointer}.card span{color:#68717d;font-size:13px}.card strong{display:block;font-size:28px;margin-top:6px}
.filters{display:grid;grid-template-columns:150px 150px 180px 180px 1fr;gap:10px;padding:16px}.panel{overflow:hidden}.paneltop{padding:16px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:12px 14px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{background:#f8f9fa;color:#606a76;font-size:12px}
.name{font-weight:700;color:#197659;text-decoration:underline;cursor:pointer}.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.available{background:#e6f7ef;color:#176d46}.cover{background:#e8f0ff;color:#245eb5}.off{background:#fdeaea;color:#a92c2c}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modalbox{background:#fff;width:min(900px,98vw);max-height:94vh;overflow:auto;border-radius:14px}.modaltop{padding:16px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.modalbody{padding:18px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .field{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;font-weight:700;color:#6b7280;padding:6px}.day{border:1px solid #e2e5e8;border-radius:8px;min-height:78px;padding:6px;font-size:11px}.day b{display:block;margin-bottom:5px}.day.available{background:#eefaf4}.day.cover{background:#eef4ff}.day.off{background:#fff0f0}.day.blank{background:#fafafa}
.summary{margin-top:16px}.summary div{padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.msg{margin-top:10px;font-size:13px}.err{color:#c62828}.ok{color:#197659}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.filters,.formgrid{grid-template-columns:1fr}.day{min-height:62px}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="box"><h1>Escala do Plantão</h1><div class="muted">Acesso ao painel de plantonistas</div>
  <div class="field"><label>E-mail</label><input id="email" type="email"></div>
  <div class="field"><label>Senha</label><input id="senha" type="password"></div>
  <button class="btn green" style="width:100%" onclick="entrar()">Entrar</button><div id="loginMsg" class="msg err"></div>
 </div>
</div>

<div id="app" class="hide">
<header><div><h1>Painel de Plantonistas</h1><div class="muted" id="hojeTxt"></div></div><div class="actions"><button class="btn white" onclick="abrirCadastro()">+ Motorista</button><button class="btn green" onclick="abrirCobertura()">+ Nova Cobertura</button><button class="btn red" onclick="sair()">Sair</button></div></header>
<main>
 <div class="cards">
  <div class="card" onclick="setSit('')"><span>Total</span><strong id="kTotal">0</strong></div>
  <div class="card" onclick="setSit('Disponível')"><span>Disponíveis</span><strong id="kDisp">0</strong></div>
  <div class="card" onclick="setSit('Em cobertura')"><span>Em cobertura</span><strong id="kCob">0</strong></div>
  <div class="card" onclick="setSit('Indisponível')"><span>Indisponíveis</span><strong id="kInd">0</strong></div>
 </div>
 <div class="panel">
  <div class="filters">
   <div><label>Data</label><input id="fData" type="date" onchange="montarLista()"></div>
   <div><label>Período</label><select id="fPeriodo" onchange="renderLista()"><option value="">Todos</option><option>Manhã</option><option>Tarde</option></select></div>
   <div><label>Situação</label><select id="fSituacao" onchange="renderLista()"><option value="">Todos</option><option>Disponível</option><option>Em cobertura</option><option>Indisponível</option></select></div>
   <div><label>Linha</label><select id="fLinha" onchange="renderLista()"><option value="">Todas</option></select></div>
   <div><label>Buscar</label><input id="fBusca" placeholder="Nome ou matrícula..." oninput="renderLista()"></div>
  </div>
  <div class="paneltop"><div><b>Escala diária</b><div class="muted">Clique no motorista para ver o mês completo</div></div><button class="btn green" onclick="setSit('Disponível')">🟢 Disponíveis</button></div>
  <div class="tablewrap"><table><thead><tr><th>Matrícula</th><th>Motorista</th><th>Período</th><th>Horário</th><th>Situação</th><th>Linha</th><th>Motivo</th></tr></thead><tbody id="tbody"></tbody></table></div>
 </div>
</main>
</div>

<div id="modalCadastro" class="modal hide"><div class="modalbox"><div class="modaltop"><b>Cadastrar motorista</b><button class="btn gray" onclick="fechar('modalCadastro')">✕</button></div><div class="modalbody">
<input id="mId" type="hidden"><div class="formgrid">
<div class="field"><label>Matrícula *</label><input id="mMat"></div><div class="field"><label>Nome completo *</label><input id="mNome"></div>
<div class="field"><label>Telefone</label><input id="mTel" placeholder="5511999999999"></div><div class="field"><label>Período *</label><select id="mPer" onchange="horaBase()"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option></select></div>
<div class="field"><label>Horário base</label><input id="mHora" type="time" readonly></div></div>
<div class="actions" style="margin-top:16px"><button class="btn green" onclick="salvarMotorista()">Salvar</button><button class="btn gray" onclick="fechar('modalCadastro')">Cancelar</button></div><div id="mMsg" class="msg"></div>
</div></div></div>

<div id="modalCobertura" class="modal hide"><div class="modalbox"><div class="modaltop"><b>Nova cobertura</b><button class="btn gray" onclick="fechar('modalCobertura')">✕</button></div><div class="modalbody">
<div class="formgrid">
<div class="field"><label>Motorista *</label><select id="cMot"></select></div><div class="field"><label>Linha *</label><select id="cLin"></select></div>
<div class="field"><label>Motivo *</label><select id="cMotivo"></select></div><div class="field"><label>Período *</label><select id="cPer"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option></select></div>
<div class="field"><label>Horário da linha</label><input id="cHora" type="time"></div><div class="field"><label>Início *</label><input id="cIni" type="date"></div>
<div class="field"><label>Fim *</label><input id="cFim" type="date"></div><div class="field"><label>Observação</label><textarea id="cObs"></textarea></div></div>
<div class="actions" style="margin-top:16px"><button class="btn green" onclick="salvarCobertura()">Salvar cobertura</button><button class="btn gray" onclick="fechar('modalCobertura')">Cancelar</button></div><div id="cMsg" class="msg"></div>
</div></div></div>

<div id="modalMotorista" class="modal hide"><div class="modalbox"><div class="modaltop"><div><b id="calNome"></b><div class="muted" id="calSub"></div></div><button class="btn gray" onclick="fechar('modalMotorista')">✕</button></div><div class="modalbody">
<div class="actions" style="justify-content:space-between;margin-bottom:14px"><button class="btn white" onclick="mudarMes(-1)">◀</button><b id="calMes"></b><button class="btn white" onclick="mudarMes(1)">▶</button></div>
<div id="cal"></div><h3>Resumo do mês</h3><div id="resumo" class="summary"></div>
<div class="actions" style="margin-top:18px"><button class="btn blue" onclick="pdf()">📄 PDF</button><button class="btn white" onclick="imprimir()">🖨️ Imprimir</button><button class="btn green" onclick="whatsapp()">💬 WhatsApp</button></div>
</div></div></div>

<script>
const SUPABASE_URL="https://chmkhlfmbvnppygjhxsx.supabase.co";
const SUPABASE_KEY="sb_publishable_Bv7x7jufiVP1aPxOHBJ32A_aX783DbD";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let P=[],L=[],M=[],C=[],I=[],lista=[],atual=null,mesAtual=new Date();
const isoHoje=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dataBR=s=>s?s.split("-").reverse().join("/"):"-"; const hora=s=>s?s.slice(0,5):"-";
const linha=id=>L.find(x=>x.id==id)?.codigo||"-"; const motivo=id=>M.find(x=>x.id==id)?.nome||"-";
function fechar(id){document.getElementById(id).classList.add("hide")}
async function entrar(){let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:senha.value});if(error){loginMsg.innerText=error.message;return}iniciar()}
async function sair(){await sb.auth.signOut();location.reload()}
async function iniciar(){login.classList.add("hide");app.classList.remove("hide");hojeTxt.innerText=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});fData.value=isoHoje();await carregar()}
async function carregar(){
 let [p,l,m,c,i]=await Promise.all([sb.from("plantonistas").select("*").order("nome"),sb.from("linhas").select("*").order("codigo"),sb.from("motivos").select("*").eq("ativo",true).order("nome"),sb.from("coberturas").select("*").neq("status","CANCELADA"),sb.from("indisponibilidades").select("*").eq("ativa",true)]);
 if([p,l,m,c,i].some(x=>x.error)){alert("Erro ao carregar o banco.");return}P=p.data||[];L=l.data||[];M=m.data||[];C=c.data||[];I=i.data||[];
 fLinha.innerHTML='<option value="">Todas</option>'+L.filter(x=>x.ativa).map(x=>`<option value="${x.id}">${x.codigo}</option>`).join("");
 cLin.innerHTML='<option value="">Selecione</option>'+L.filter(x=>x.ativa).map(x=>`<option value="${x.id}">${x.codigo}</option>`).join("");
 cMotivo.innerHTML='<option value="">Selecione</option>'+M.map(x=>`<option value="${x.id}">${x.nome}</option>`).join("");
 cMot.innerHTML='<option value="">Selecione</option>'+P.filter(x=>x.ativo).map(x=>`<option value="${x.id}">${x.matricula} - ${x.nome}</option>`).join("");
 montarLista()
}
function estado(p,d){let i=I.find(x=>x.plantonista_id===p.id&&x.data_inicio<=d&&x.data_fim>=d);if(i)return{sit:"Indisponível",lin:"-",mot:i.tipo||"Indisponível"};let c=C.find(x=>x.plantonista_id===p.id&&x.status==="ATIVA"&&x.data_inicio<=d&&x.data_fim>=d);if(c)return{sit:"Em cobertura",lin:linha(c.linha_id),mot:motivo(c.motivo_id),c};return{sit:"Disponível",lin:"-",mot:"-"}}
function montarLista(){let d=fData.value||isoHoje();lista=P.filter(x=>x.ativo).map(p=>({...p,...estado(p,d)}));kTotal.innerText=lista.length;kDisp.innerText=lista.filter(x=>x.sit==="Disponível").length;kCob.innerText=lista.filter(x=>x.sit==="Em cobertura").length;kInd.innerText=lista.filter(x=>x.sit==="Indisponível").length;renderLista()}
function setSit(s){fSituacao.value=s;renderLista()}
function renderLista(){let q=fBusca.value.toLowerCase(),per=fPeriodo.value,sit=fSituacao.value,lin=fLinha.value;let a=lista.filter(x=>(!q||x.nome.toLowerCase().includes(q)||String(x.matricula).includes(q))&&(!per||x.periodo===per)&&(!sit||x.sit===sit)&&(!lin||String(x.c?.linha_id||"")===lin));tbody.innerHTML=a.length?a.map(x=>`<tr><td>${x.matricula}</td><td><span class="name" onclick="abrirMotorista(${x.id})">${x.nome}</span></td><td>${x.periodo}</td><td>${hora(x.horario_base)}</td><td><span class="badge ${x.sit==="Disponível"?"available":x.sit==="Em cobertura"?"cover":"off"}">${x.sit}</span></td><td>${x.lin}</td><td>${x.mot}</td></tr>`).join(""):'<tr><td colspan="7" style="text-align:center;padding:28px;color:#777">Nenhum motorista encontrado.</td></tr>'}
function abrirCadastro(){mId.value=mMat.value=mNome.value=mTel.value=mPer.value=mHora.value="";mMsg.innerText="";modalCadastro.classList.remove("hide")}
function horaBase(){mHora.value=mPer.value==="Manhã"?"05:00":mPer.value==="Tarde"?"15:00":""}
async function salvarMotorista(){if(!mMat.value.trim()||!mNome.value.trim()||!mPer.value){mMsg.className="msg err";mMsg.innerText="Preencha matrícula, nome e período.";return}let r=await sb.from("plantonistas").insert({matricula:mMat.value.trim(),nome:mNome.value.trim().toUpperCase(),telefone:mTel.value.trim()||null,periodo:mPer.value,horario_base:mHora.value,ativo:true});if(r.error){mMsg.className="msg err";mMsg.innerText=r.error.message;return}fechar("modalCadastro");await carregar()}
function abrirCobertura(){cMot.value=cLin.value=cMotivo.value=cPer.value=cHora.value=cIni.value=cFim.value=cObs.value="";cMsg.innerText="";modalCobertura.classList.remove("hide")}
cLin.addEventListener("change",()=>{let x=L.find(a=>a.id==cLin.value);if(x){cPer.value=x.periodo||"";cHora.value=x.horario?x.horario.slice(0,5):""}})
async function salvarCobertura(){let pid=+cMot.value,li=+cLin.value,mi=+cMotivo.value;if(!pid||!li||!mi||!cPer.value||!cIni.value||!cFim.value){cMsg.className="msg err";cMsg.innerText="Preencha os campos obrigatórios.";return}if(cFim.value<cIni.value){cMsg.className="msg err";cMsg.innerText="A data final é inválida.";return}let conflito=C.find(x=>x.plantonista_id===pid&&x.status==="ATIVA"&&cIni.value<=x.data_fim&&x.data_inicio<=cFim.value);let ind=I.find(x=>x.plantonista_id===pid&&cIni.value<=x.data_fim&&x.data_inicio<=cFim.value);if(conflito||ind){cMsg.className="msg err";cMsg.innerText="Este motorista já está ocupado/indisponível nesse período.";return}let r=await sb.from("coberturas").insert({plantonista_id:pid,linha_id:li,motivo_id:mi,periodo:cPer.value,horario_linha:cHora.value||null,data_inicio:cIni.value,data_fim:cFim.value,observacao:cObs.value.trim()||null,status:"ATIVA"});if(r.error){cMsg.className="msg err";cMsg.innerText=r.error.message;return}fechar("modalCobertura");await carregar()}
function abrirMotorista(id){atual=P.find(x=>x.id===id);let d=fData.value?new Date(fData.value+"T12:00:00"):new Date();mesAtual=new Date(d.getFullYear(),d.getMonth(),1);calNome.innerText=atual.matricula+" - "+atual.nome;calSub.innerText=atual.periodo+" | "+hora(atual.horario_base);modalMotorista.classList.remove("hide");renderCal()}
function mudarMes(n){mesAtual=new Date(mesAtual.getFullYear(),mesAtual.getMonth()+n,1);renderCal()}
function dadosMes(){let a=mesAtual.getFullYear(),m=mesAtual.getMonth()+1,n=new Date(a,m,0).getDate(),r=[];for(let d=1;d<=n;d++){let dt=`${a}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;r.push({data:dt,...estado(atual,dt)})}return r}
function blocos(d){let out=[],ini=0;for(let i=1;i<=d.length;i++){let a=d[i-1],b=d[i];if(i===d.length||a.sit!==b.sit||a.lin!==b.lin||a.mot!==b.mot){out.push({ini:d[ini].data,fim:a.data,...a});ini=i}}return out}
function renderCal(){let a=mesAtual.getFullYear(),m=mesAtual.getMonth()+1,d=dadosMes(),off=(new Date(a,m-1,1).getDay()+6)%7;calMes.innerText=new Date(a,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).toUpperCase();let h='<div class="calendar">'+["SEG","TER","QUA","QUI","SEX","SÁB","DOM"].map(x=>`<div class="dow">${x}</div>`).join("");for(let i=0;i<off;i++)h+='<div class="day blank"></div>';d.forEach((x,i)=>h+=`<div class="day ${x.sit==="Disponível"?"available":x.sit==="Em cobertura"?"cover":"off"}"><b>${i+1}</b>${x.sit==="Disponível"?"Plantão":x.sit==="Em cobertura"?x.lin+"<br>"+x.mot:x.mot}</div>`);cal.innerHTML=h+"</div>";resumo.innerHTML=blocos(d).map(x=>`<div><b>${dataBR(x.ini)}${x.ini!==x.fim?" até "+dataBR(x.fim):""}</b> — ${x.sit==="Disponível"?"Plantão":x.sit==="Em cobertura"?x.lin+" - "+x.mot:x.mot}</div>`).join("")}
function texto(){let a=mesAtual.getFullYear(),m=mesAtual.getMonth()+1,t=`Escala - ${atual.nome}\nMatrícula: ${atual.matricula}\n${calMes.innerText}\n\n`;blocos(dadosMes()).forEach(x=>t+=`${dataBR(x.ini)}${x.ini!==x.fim?" a "+dataBR(x.fim):""} - ${x.sit==="Disponível"?"Plantão":x.sit==="Em cobertura"?x.lin+" - "+x.mot:x.mot}\n`);return t}
function whatsapp(){let tel=(atual.telefone||"").replace(/\D/g,"");window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto())}`,"_blank")}
function pdf(){let {jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(15);doc.text("ESCALA MENSAL DO PLANTONISTA",14,16);doc.setFontSize(10);doc.text(`Matrícula: ${atual.matricula}`,14,25);doc.text(`Nome: ${atual.nome}`,14,31);doc.text(`Período: ${atual.periodo} | Horário: ${hora(atual.horario_base)}`,14,37);doc.text(`Mês: ${calMes.innerText}`,14,43);let y=54;blocos(dadosMes()).forEach(x=>{doc.text(`${dataBR(x.ini)}${x.ini!==x.fim?" a "+dataBR(x.fim):""} - ${x.sit==="Disponível"?"Plantão":x.sit==="Em cobertura"?x.lin+" - "+x.mot:x.mot}`,14,y);y+=7});doc.save(`Escala_${atual.matricula}_${mesAtual.getMonth()+1}_${mesAtual.getFullYear()}.pdf`)}
function imprimir(){let w=window.open("","_blank");w.document.write(`<html><head><title>Escala</title><style>body{font-family:Arial;padding:25px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day,.dow{border:1px solid #ccc;padding:7px;min-height:55px}.summary div{padding:6px;border-bottom:1px solid #ddd}</style></head><body><h2>${calNome.innerText}</h2><h3>${calMes.innerText}</h3>${cal.innerHTML}<h3>Resumo</h3>${resumo.innerHTML}</body></html>`);w.document.close();w.print()}
(async()=>{let {data}=await sb.auth.getSession();if(data.session)iniciar()})();
</script>
</body>
</html>
